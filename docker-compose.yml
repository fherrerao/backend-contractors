services:
  db:
    image: postgres:16
    container_name: contractors-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contractors_db
    ports:
      - '5433:5432'
    volumes:
      - contractors-db-data:/var/lib/postgresql/data

volumes:
  contractors-db-data:
